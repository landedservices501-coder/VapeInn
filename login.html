<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VapeX</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<!--================ HEADER ================-->

<header>

    <div class="logo">
        <h1>VapeX</h1>
    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <div class="header-icons">

        <a href="#"><i class="fas fa-search"></i></a>
        <a href="wishlist.html"><i class="fas fa-heart"></i></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
        <a href="login.html"><i class="fas fa-user"></i></a>

    </div>

</header>

<!--================ BREADCRUMB ================-->

<section class="breadcrumb">

    <a href="index.html">Home</a>

    <span>/</span>

    <span class="current">Login</span>

</section>

<!--================ LOGIN ================-->

<section class="login-section">

    <div class="login-container">

        <!-- Left Side -->

        <div class="login-info">

            <h2>Welcome Back!</h2>

            <p>

                Sign in to your VapeX account to view your orders,
                manage your wishlist, enjoy faster checkout,
                and discover exclusive offers.

            </p>

            <img src="images/login-banner.png" alt="Login Illustration">

        </div>

        <!-- Right Side -->

        <div class="login-form">

            <h2>Login</h2>

            <form action="#">

                <div class="input-box">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            placeholder="Enter your password"
                            required>

                        <button type="button" class="toggle-password">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">

                    Login

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="social-login">

                <button class="google">

                    <i class="fab fa-google"></i>

                    Google

                </button>

                <button class="facebook">

                    <i class="fab fa-facebook-f"></i>

                    Facebook

                </button>

                <button class="apple">

                    <i class="fab fa-apple"></i>

                    Apple

                </button>

            </div>

            <p class="register-link">

                Don't have an account?

                <a href="register.html">

                    Create One

                </a>

            </p>

        </div>

    </div>

</section>

</body>

</html>
