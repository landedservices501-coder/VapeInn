<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | VapeX</title>

    <link rel="stylesheet" href="css/register.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>

<!--================ HEADER ================-->

<header>

    <div class="logo">
        <h1>VapeX</h1>
    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <div class="header-icons">

        <a href="#"><i class="fas fa-search"></i></a>
        <a href="wishlist.html"><i class="fas fa-heart"></i></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
        <a href="login.html"><i class="fas fa-user"></i></a>

    </div>

</header>

<!--================ BREADCRUMB ================-->

<section class="breadcrumb">

    <a href="index.html">Home</a>

    <span>/</span>

    <span class="current">Create Account</span>

</section>

<!--================ REGISTER SECTION ================-->

<section class="register-section">

    <div class="register-container">

        <!-- Left Content -->

        <div class="register-info">

            <h2>Join VapeX Today</h2>

            <p>

                Create your free account to enjoy faster checkout,
                save your favorite products, track your orders,
                and receive exclusive member-only offers.

            </p>

            <img src="images/register-banner.png"
            alt="Create Account">

        </div>

        <!-- Registration Form -->

        <div class="register-form">

            <h2>Create Account</h2>

            <form action="#">

                <div class="row">

                    <div class="input-box">

                        <label>First Name</label>

                        <input
                        type="text"
                        placeholder="John"
                        required>

                    </div>

                    <div class="input-box">

                        <label>Last Name</label>

                        <input
                        type="text"
                        placeholder="Doe"
                        required>

                    </div>

                </div>

                <div class="input-box">

                    <label>Email Address</label>

                    <input
                    type="email"
                    placeholder="Enter your email"
                    required>

                </div>

                <div class="input-box">

                    <label>Phone Number</label>

                    <input
                    type="tel"
                    placeholder="+1 234 567 890"
                    required>

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                        type="password"
                        placeholder="Create password"
                        required>

                        <button
                        type="button"
                        class="toggle-password">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="input-box">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                        type="password"
                        placeholder="Confirm password"
                        required>

                        <button
                        type="button"
                        class="toggle-password">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="terms">

                    <label>

                        <input
                        type="checkbox"
                        required>

                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.

                    </label>

                </div>

                <button
                type="submit"
                class="register-btn">

                    Create Account

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="social-register">

                <button class="google">

                    <i class="fab fa-google"></i>

                    Sign up with Google

                </button>

                <button class="facebook">

                    <i class="fab fa-facebook-f"></i>

                    Sign up with Facebook

                </button>

                <button class="apple">

                    <i class="fab fa-apple"></i>

                    Sign up with Apple

                </button>

            </div>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login Here

                </a>

            </p>

        </div>

    </div>

</section>

</body>
</html>
